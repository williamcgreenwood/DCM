[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pillars-dcm"
version = "6.0.0"
description = "Pillars Distribution Cushion Model v6 canonical Python engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pillars-dcm = "dcm.runner:main"
dcm = "dcm.runner:main"
dcm-host = "dcm.chat.cli:main"

[tool.setuptools.package-dir]
"" = "artifacts/dcm_v6_workstream_ab"

[tool.setuptools.packages.find]
where = ["artifacts/dcm_v6_workstream_ab"]
include = ["dcm*", "pillars_dcm*"]

[tool.setuptools.package-data]
dcm = ["VERSION.json", "data/synthetic_har.json", "data/source_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["artifacts/dcm_v6_workstream_ab/tests"]
pythonpath = ["artifacts/dcm_v6_workstream_ab"]
addopts = "-q"
