[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pillars-dcm"
version = "6.0.0"
description = "Pillars Distribution Cushion Model v6 canonical Python engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pillars-dcm = "dcm.runner:main"
dcm = "dcm.runner:main"
dcm-host = "dcm.chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcm*", "pillars_dcm*"]

[tool.setuptools.package-data]
dcm = [
    "VERSION.json",
    "data/synthetic_har.json",
    "data/source_catalog.json",
    "signals/schemas/*.json",
    "algorithms/data/*",
    "algorithms/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
