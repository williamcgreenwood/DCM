name: DCM v6 branch CI

concurrency:
  group: dcm-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - chatgpt/v6-production-completion-20260828
      - grok/v6-live-har-production
  pull_request:
    paths:
      - "artifacts/dcm_v6_workstream_ab/**"
      - ".github/workflows/dcm-v6-ci.yml"

permissions:
  contents: read

jobs:
  python-dcm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/dcm_v6_workstream_ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall -q dcm tests
      - name: Test
        env:
          PYTHONPATH: .
          DCM_FAST_WORLDS: "64"
          DCM_SERIOUS_WORLDS: "128"
          DCM_MAX_WORLDS: "256"
        run: pytest -q
      - name: Benchmark smoke
        env:
          PYTHONPATH: .
          DCM_FAST_WORLDS: "32"
          DCM_SERIOUS_WORLDS: "64"
          DCM_MAX_WORLDS: "128"
        run: |
          python -m dcm.runtime.benchmark --sizes 100 1000 --out /tmp/dcm-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/dcm-benchmark/benchmark_report.json").read_text())
          assert report["hostPerformanceCertified"] is False
          assert [r["boardRows"] for r in report["results"]] == [100, 1000]
          assert all(r["rowsPerWallSecond"] > 0 for r in report["results"])
          PY
