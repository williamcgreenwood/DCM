name: DCM v6 branch CI

concurrency:
  group: dcm-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - chatgpt/v6-production-completion-20260828
      - grok/v6-live-har-production
      - integration/v6-chatgpt-runtime-20260829
      - integration/v6-ml-architecture-20260830
  pull_request:

permissions:
  contents: read

jobs:
  python-dcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package from repo root
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: CLI smoke from clean cwd
        working-directory: /tmp
        run: pillars-dcm --help
      - name: CLI module help
        working-directory: /tmp
        run: python -m dcm --help
      - name: CLI pillars_dcm help
        working-directory: /tmp
        run: python -m pillars_dcm --help
      - name: Host CLI help
        working-directory: /tmp
        run: |
          dcm-host --help
          python -m dcm.chat --help
          dcm-host doctor
      - name: Synthetic smoke
        working-directory: /tmp
        run: python -m dcm --synthetic --research fixture --cutoff-from-capture --out /tmp/dcm-smoke
      - name: Test
        env:
          DCM_FAST_WORLDS: "64"
          DCM_SERIOUS_WORLDS: "128"
          DCM_MAX_WORLDS: "256"
        run: pytest -q
      - name: Algorithm constitution gates
        run: |
          python scripts/export_algorithm_registry.py --check
          python benchmarks/algorithm_frontier/core_smoke.py
      - name: Permanent coding and prompt policy
        run: python scripts/validate_dcm_policy.py
      - name: Code inventory stale-check
        run: python scripts/build_code_inventory.py --check
      - name: Benchmark smoke
        env:
          DCM_FAST_WORLDS: "32"
          DCM_SERIOUS_WORLDS: "64"
          DCM_MAX_WORLDS: "128"
        run: |
          python -m dcm.runtime.benchmark --sizes 100 1000 --out /tmp/dcm-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/dcm-benchmark/benchmark_report.json").read_text())
          assert report["hostPerformanceCertified"] is False
          assert [r["boardRows"] for r in report["results"]] == [100, 1000]
          assert all(r["rowsPerWallSecond"] > 0 for r in report["results"])
          PY
      - name: Baseline profile harness smoke
        run: |
          python benchmarks/baseline/profile_baseline.py --smoke --out /tmp/dcm-baseline-smoke --tag smoke
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/dcm-baseline-smoke/baseline_profile_smoke.json").read_text())
          assert report["hostPerformanceCertified"] is False
          assert report["schema"] == "pillars_dcm.baseline_profile.v1"
          assert report["boardSizes"] == [100]
          assert report["worldSizes"] == [64]
          assert report["hotspots"]
          PY
