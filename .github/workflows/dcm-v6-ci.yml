name: DCM v6 branch CI

concurrency:
  group: dcm-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - chatgpt/v6-production-completion-20260828
      - grok/v6-live-har-production
      - integration/v6-chatgpt-runtime-20260829
      - integration/v6-ml-architecture-20260830
  pull_request:

permissions:
  contents: write

jobs:
  python-dcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package from repo root
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: CLI smoke from clean cwd
        working-directory: /tmp
        run: pillars-dcm --help
      - name: CLI module help
        working-directory: /tmp
        run: python -m dcm --help
      - name: CLI pillars_dcm help
        working-directory: /tmp
        run: python -m pillars_dcm --help
      - name: Host CLI help
        working-directory: /tmp
        run: |
          dcm-host --help
          python -m dcm.chat --help
          dcm-host doctor
      - name: Synthetic smoke
        working-directory: /tmp
        run: python -m dcm --synthetic --research fixture --cutoff-from-capture --out /tmp/dcm-smoke
      - name: Test
        env:
          DCM_FAST_WORLDS: "64"
          DCM_SERIOUS_WORLDS: "128"
          DCM_MAX_WORLDS: "256"
        run: pytest -q
      - name: Regenerate code inventory with official generator
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/cfb-guarded-launch-20260902'
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B cfb-inventory "origin/${{ github.head_ref }}"
          python scripts/build_code_inventory.py --write
          if ! git diff --quiet -- docs/generated/CODE_INVENTORY.json docs/generated/CODE_INVENTORY.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/generated/CODE_INVENTORY.json docs/generated/CODE_INVENTORY.md
            git commit -m "Regenerate code inventory with official generator"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
      - name: Code inventory stale-check
        run: python scripts/build_code_inventory.py --check
      - name: Benchmark smoke
        env:
          DCM_FAST_WORLDS: "32"
          DCM_SERIOUS_WORLDS: "64"
          DCM_MAX_WORLDS: "128"
        run: |
          python -m dcm.runtime.benchmark --sizes 100 1000 --out /tmp/dcm-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/dcm-benchmark/benchmark_report.json").read_text())
          assert report["hostPerformanceCertified"] is False
          assert [r["boardRows"] for r in report["results"]] == [100, 1000]
          assert all(r["rowsPerWallSecond"] > 0 for r in report["results"])
          PY
