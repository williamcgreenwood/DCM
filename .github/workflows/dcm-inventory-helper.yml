name: DCM inventory artifact helper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate inventory
        run: python scripts/build_code_inventory.py --write
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: dcm-generated-inventory
          path: |
            docs/generated/CODE_INVENTORY.json
            docs/generated/CODE_INVENTORY.md
      - name: Emit generated inventory
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ("docs/generated/CODE_INVENTORY.json", "docs/generated/CODE_INVENTORY.md"):
              data = Path(name).read_bytes()
              print("DCM_ARTIFACT_BEGIN:" + name)
              for offset in range(0, len(data), 6000):
                  chunk = base64.b64encode(data[offset:offset + 6000]).decode("ascii")
                  print(f"DCM_ARTIFACT_CHUNK:{offset}:{chunk}")
              print("DCM_ARTIFACT_END:" + name)
          PY
